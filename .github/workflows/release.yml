name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the zip, the addons and the checksums
        id: pack
        run: |
          zip -r voidwatch-module.zip voidwatch upload setup-* remove-* README.txt LICENSE
          files="voidwatch-module.zip"
          mkdir -p parts
          for d in addons/*/; do
            [ -f "${d}addon.json" ] || continue
            id=$(basename "$d")
            (cd addons && zip -qr "../addon-$id.zip" "$id")
            jq --argjson size "$(stat -c %s "addon-$id.zip")" '. + {size: $size}' "${d}addon.json" > "parts/$id.json"
            files="$files addon-$id.zip"
          done
          if ls parts/*.json > /dev/null 2>&1; then jq -s '.' parts/*.json > addons.json; else echo '[]' > addons.json; fi
          sha256sum $files addons.json > SHA256SUMS
          echo "files=$files addons.json SHA256SUMS" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ${{ steps.pack.outputs.files }} --title "$GITHUB_REF_NAME" --generate-notes
