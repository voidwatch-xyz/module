name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the zip and the checksum
        run: |
          zip -r voidwatch-module.zip voidwatch upload setup-* remove-* README.txt LICENSE
          sha256sum voidwatch-module.zip > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" voidwatch-module.zip SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
